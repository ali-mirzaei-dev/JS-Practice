<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>20 - Interactive Product Card</title>
    <link rel="stylesheet" href="../assets/StyleSheet/output.css">
    <style>
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        input[type="number"] {
            -moz-appearance: textfield;
            appearance: textfield;
        }

        @keyframes jump {
            50% {
                transform: translateY(-10px);
                scale: 1.1;
            }
        }

        .jump {
            animation: jump 0.4s ease forwards;
        }
    </style>
</head>

<body class="bg-bg-secondary text-white font-mono p-10">

    <!-- Back Link -->
    <a href="../index.html#chapters" class="text-accent text-sm uppercase tracking-widest">← Back to Index</a>

    <div class="max-w-4xl mx-auto flex flex-wrap gap-10 justify-center relative">

        <!-- card 1 -->
        <div class="w-full max-w-sm bg-white/5 border border-white/10 rounded-xl p-6 flex flex-wrap gap-y-4 content-start ">

            <div class="w-full h-40 bg-lime-300/80 rounded-md flex items-center justify-center text-bg-secondary font-bold text-xl mb-2">Image</div>

            <h4 class="w-full font-display text-xl text-accent font-bold">Product 1</h4>
            <p class="w-full text-sm text-text-secondary">Lorem ipsum dolor sit amet, consectetur adipisicing elit. Maiores, nulla.</p>

            <div class="w-full flex gap-1 items-center text-sm">
                <p>price : $</p>
                <span>7</span>
            </div>

            <button onclick="minusBtn(this)" class="w-10 h-10 border border-white/10 rounded-md text-2xl hover:bg-accent hover:text-white hover:border-accent active:scale-95 transition-all flex items-center justify-center">-</button>
            <input value="1" min="1" max="10" readonly class="flex-1 mx-2 h-10 text-center bg-white/5 border border-white/10 rounded-md p-1 inputClass" type="number">
            <button onclick="plusBtn(this)" class="w-10 h-10 border border-white/10 rounded-md text-2xl hover:bg-accent hover:text-white hover:border-accent active:scale-95 transition-all flex items-center justify-center">+</button>

            <div class="w-full flex justify-between items-center mt-2 border-t border-white/10 pt-4">
                <span class="text-sm text-text-secondary">Your total price : $</span>
                <span class="text-lg font-bold totalPrice">7</span>
            </div>

            <button onclick="addBtn(this)" class="w-full mt-2 bg-accent text-white py-2 rounded-md hover:bg-white hover:text-black transition-all font-bold uppercase tracking-wider text-sm">Add to Cart</button>
        </div>

        <!-- card 2 -->
        <div class="w-full max-w-sm bg-white/5 border border-white/10 rounded-xl p-6 flex flex-wrap gap-y-4 content-start ">

            <div class="w-full h-40 bg-lime-300/80 rounded-md flex items-center justify-center text-bg-secondary font-bold text-xl mb-2">Image</div>

            <h4 class="w-full font-display text-xl text-accent font-bold">Product 2</h4>
            <p class="w-full text-sm text-text-secondary">Lorem ipsum dolor sit amet, consectetur adipisicing elit. Maiores, nulla.</p>

            <div class="w-full flex gap-1 items-center text-sm">
                <p>price : $</p>
                <span>12</span>
            </div>

            <button onclick="minusBtn(this)" class="w-10 h-10 border border-white/10 rounded-md text-2xl hover:bg-accent hover:text-white hover:border-accent active:scale-95 transition-all flex items-center justify-center">-</button>
            <input value="1" min="1" max="10" readonly class="flex-1 mx-2 h-10 text-center bg-white/5 border border-white/10 rounded-md p-1 inputClass" type="number">
            <button onclick="plusBtn(this)" class="w-10 h-10 border border-white/10 rounded-md text-2xl hover:bg-accent hover:text-white hover:border-accent active:scale-95 transition-all flex items-center justify-center">+</button>

            <div class="w-full flex justify-between items-center mt-2 border-t border-white/10 pt-4">
                <span class="text-sm text-text-secondary">Your total price : $</span>
                <span class="text-lg font-bold totalPrice">12</span>
            </div>

            <button onclick="addBtn(this)" class="w-full mt-2 bg-accent text-white py-2 rounded-md hover:bg-white hover:text-black transition-all font-bold uppercase tracking-wider text-sm">Add to Cart</button>
        </div>

    </div>

    <!-- shoping cart -->
    <div class="absolute top-10 right-10 w-32 border-2 border-red-500 flex flex-wrap content-start  *:w-full">
        <button id="listBtn" onclick="showListBtn(this)" class="">shoping list</button>

        <div id="listOfProducts" class=" border-2 border-blue-500 absolute duration-300 top-full left-0">



        </div>


    </div>

    <script>
        function minusBtn(element) {

            const myInput = element.parentElement.querySelector(".inputClass")
            const myValue = myInput.value

            const basePrice = element.parentElement.querySelector("div>span")

            let newValue;

            if (myValue > 1) {
                newValue = myValue - 1

            } else {
                newValue = 1
            }

            myInput.value = newValue

            const priceOutput = element.parentElement.querySelector(".totalPrice")

            let newPrice = +basePrice.innerText * newValue
            priceOutput.innerText = newPrice

        }

        function plusBtn(element) {

            const myInput = element.parentElement.querySelector(".inputClass")
            const myValue = myInput.value

            const basePrice = element.parentElement.querySelector("div>span")

            let newValue;

            if (myValue < 10) {
                newValue = +myValue + 1

            } else {
                newValue = 10
            }

            myInput.value = newValue

            const priceOutput = element.parentElement.querySelector(".totalPrice")


            let newPrice = +basePrice.innerText * newValue
            priceOutput.innerText = newPrice
        }

        function addBtn(element) {

            const listBtn = document.getElementById("listBtn")
            listBtn.classList.add("jump")

            setTimeout(() => {

                listBtn.classList.remove("jump")
            }, 400);

            const name = element.parentElement.querySelector("h4").innerText
            const price = element.parentElement.querySelector("div:nth-of-type(3)>span:nth-of-type(2)").innerText
            const amount = element.parentElement.querySelector(".inputClass").value


            let listOfProducts = document.getElementById("listOfProducts")

            listOfProducts.innerHTML = "<div class:'flex flex-wrap w-full '>"
            listOfProducts.innerHTML = "<h6 class:'w-full'>name<h6/>"
            listOfProducts.innerHTML = "<span class:' '>"

        }

        function showListBtn(element) {

            const selectedProducts = element.parentElement.querySelector("div")

            selectedProducts.style.left = '0'

        }

    </script>

</body>

</html>
