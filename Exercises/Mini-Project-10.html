<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>11 - Task Stats Dashboard</title>
    <link rel="stylesheet" href="../assets/StyleSheet/output.css">
</head>

<body class="bg-[#F2F2F2] text-[#111111] font-sans p-10 min-h-screen flex flex-col items-center">

    <!-- Back Link -->
    <a href="../index.html#projects" class="text-accent text-sm uppercase tracking-widest border border-accent/50 px-3 py-1.5 rounded-full hover:bg-accent hover:text-white transition-colors mb-12 self-start">← Back to Index</a>

    <!-- Semi-Project Header -->
    <header class="mb-12 text-center">
        <span class="font-mono text-[11px] tracking-[0.2em] uppercase block mb-4 text-accent">// Mini Project 11</span>
        <h1 class='font-display font-black text-5xl md:text-7xl text-bg-secondary mb-4 tracking-tight'>Task Stats</h1>
        <p class="text-text-secondary max-w-xl mx-auto">A live dashboard counting array data using forEach and return values.</p>
    </header>

    <!-- Main Dashboard Container -->
    <main class="w-full max-w-2xl flex flex-col gap-8">

        <!-- Stats Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

            <!-- Done Card -->
            <div class="bg-white border border-text-secondary/20 p-8 rounded-xl flex flex-col items-center gap-3 shadow-sm">
                <span class="font-mono text-[10px] uppercase tracking-widest text-text-secondary">Completed</span>
                <span id="doneCount" class="font-display font-black text-6xl text-accent">0</span>
                <svg class="w-8 h-8 text-accent mt-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
            </div>

            <!-- Pending Card -->
            <div class="bg-[#111111] text-white p-8 rounded-xl flex flex-col items-center gap-3 shadow-sm">
                <span class="font-mono text-[10px] uppercase tracking-widest text-white/50">Pending</span>
                <span id="pendingCount" class="font-display font-black text-6xl text-white">0</span>
                <svg class="w-8 h-8 text-white/50 mt-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
            </div>

        </div>

        <!-- Task List Preview -->
        <div class="bg-white border border-text-secondary/20 p-6 rounded-xl flex flex-col gap-3">
            <h3 class="font-display font-black text-xl text-bg-secondary border-b border-text-secondary/20 pb-4 mb-2">Current Tasks</h3>

            <!-- <div class="flex justify-between items-center p-3 bg-[#F2F2F2] rounded-md ">
                <span class="font-bold text-sm ">Learn HTML</span>
                <span class="text-xs uppercase tracking-widest text-accent font-bold tasks">Done</span>
            </div> -->
            <div id="placeHolder" class="flex flex-col gap-2"></div>
        </div>

    </main>
    <script>

        let taskList = [
            { name: "Learn HTML", status: "Done" },
            { name: "Learn CSS", status: "Done" },
            { name: "Learn Bootstrap", status: "Done" },
            { name: "Learn Tailwind CSS", status: "Done" },
            { name: "Learn JavaScript", status: "Pending" },
            { name: "Learn React", status: "Pending" }
        ]

        const placeHolder = document.getElementById("placeHolder")
        let done = 0
        let pending = 0

        taskList.forEach((task) => {

            if (task.status == "Done") {
                done++
            } else {
                pending++
            }

            let newTask = document.createElement("div")
            newTask.className = "flex justify-between items-center p-3 bg-[#F2F2F2] rounded-md"
            newTask.innerHTML = `
            <span class="font-bold text-sm ">${task.name}</span>
            <span class="text-xs uppercase tracking-widest text-accent font-bold tasks">${task.status}</span>
            `

            placeHolder.appendChild(newTask)
        })

        document.getElementById("doneCount").innerText = done;
        document.getElementById("pendingCount").innerText = pending;






    </script>

</body>

</html>
